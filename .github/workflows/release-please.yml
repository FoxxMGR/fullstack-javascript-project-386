name: release-please

on:
  push:
    branches:
      - main

# RELEASE_PAT — персональный токен (секрет репозитория), если он задан:
# он не ограничен настройкой «Allow GitHub Actions to create and approve
# pull requests» и позволяет открывать release-PR. Если секрета нет,
# используется стандартный GITHUB_TOKEN — тогда эта настройка репозитория
# должна быть включена (см. README, раздел «Релизы и changelog»).
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main